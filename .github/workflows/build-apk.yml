name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Android Platformunu Ekle ve Senkronize Et
        run: |
          npx cap add android
          npx cap sync android

      - name: İzinleri ve WebChromeClient Yapılandırmasını Ekle
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.CAMERA" />\n \
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\n \
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n \
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n \
              <uses-feature android:name="android.hardware.camera" android:required="true" />\n \
              <uses-feature android:name="android.hardware.camera.autofocus" />\n \
              <uses-feature android:name="android.hardware.microphone" android:required="true" />' $MANIFEST_PATH

          # MainActivity.java dosyasına kamera/mikrofon izin onay köprüsünü ekle
          MAIN_ACTIVITY="android/app/src/main/java/com/example/dynamiccamera/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            sed -i 's/public class MainActivity extends BridgeActivity {/import android.webkit.PermissionRequest;\nimport android.webkit.WebChromeClient;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {\n            @Override\n            public void onPermissionRequest(final PermissionRequest request) {\n                request.grant(request.getResources());\n            }\n        });\n    }/g' $MAIN_ACTIVITY
          fi

      - name: Gradle Çalıştırma İznini Ver
        run: chmod +x android/gradlew

      - name: APK Derle (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: APK Dosyasını Çıktı Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: DynamicCamera-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
