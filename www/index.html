<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dinamik Pro Kamera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        }

        /* Üst Bar */
        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.active-torch { background: #ffcc00; color: #000; }

        /* Dinamik Mod Seçici */
        .mode-selector {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 4px;
            gap: 5px;
        }
        .mode-selector span {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.6;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mode-selector span.active {
            opacity: 1;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Kamera Önizleme Alanı */
        .viewport {
            width: 100%;
            max-width: 480px;
            flex-grow: 1;
            background: #111;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, canvas, img.preview-media, video.preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas, img.preview-media, video.preview-media { display: none; }

        /* Kayıt Süresi Sayacı */
        .timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: none;
            z-index: 15;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Flaş Efekti */
        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            z-index: 20;
        }

        /* Alt Kontrol Paneli */
        .controls {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }
        .capture-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s;
        }
        .capture-btn::after {
            content: '';
            width: 62px;
            height: 62px;
            background: white;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .capture-btn:active { transform: scale(0.92); }
        .capture-btn.recording::after {
            background: #ff3b30;
            border-radius: 12px;
            width: 36px;
            height: 36px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .action-btn.primary { background: #007aff; border-color: #007aff; }
    </style>
</head>
<body>

    <!-- Üst Bar -->
    <div class="top-bar">
        <button id="flash-btn" class="icon-btn">⚡</button>
        <div class="mode-selector">
            <span id="mode-photo" class="active">Fotoğraf</span>
            <span id="mode-video">Video</span>
        </div>
        <button id="switch-camera-btn" class="icon-btn">🔄</button>
    </div>

    <!-- Önizleme Alanı -->
    <div class="viewport">
        <div id="flash-effect" class="flash-overlay"></div>
        <div id="rec-timer" class="timer">🔴 00:00</div>
        
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="photo-canvas"></canvas>
        
        <img id="photo-preview" class="preview-media" alt="Fotoğraf">
        <video id="video-preview" class="preview-media" controls playsinline></video>
    </div>

    <!-- Alt Kontroller -->
    <div class="controls">
        <button id="retake-btn" class="action-btn">Yeniden Çek</button>
        <button id="capture-btn" class="capture-btn"></button>
        <div style="display: flex; gap: 10px;">
            <a id="download-btn" class="action-btn" style="text-decoration:none; line-height:normal;" download="medya">İndir</a>
            <button id="share-btn" class="action-btn primary">Paylaş</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('photo-canvas');
        const photoPreview = document.getElementById('photo-preview');
        const videoPreview = document.getElementById('video-preview');
        
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const downloadBtn = document.getElementById('download-btn');
        const shareBtn = document.getElementById('share-btn');
        
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const flashBtn = document.getElementById('flash-btn');
        const flashEffect = document.getElementById('flash-effect');
        const recTimer = document.getElementById('rec-timer');
        
        const modePhoto = document.getElementById('mode-photo');
        const modeVideo = document.getElementById('mode-video');

        let currentFacingMode = 'environment';
        let currentStream = null;
        let torchState = false;
        let currentMode = 'photo';

        let mediaRecorder;
        let recordedChunks = [];
        let recordingTimer = null;
        let secondsCount = 0;
        let lastBlob = null;
        let lastFileName = '';

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: currentMode === 'video'
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert("Kamera/Mikrofon izni alınamadı: " + err.message);
            }
        }

        modePhoto.addEventListener('click', () => {
            if (currentMode === 'photo') return;
            currentMode = 'photo';
            modePhoto.classList.add('active');
            modeVideo.classList.remove('active');
            startCamera();
        });

        modeVideo.addEventListener('click', () => {
            if (currentMode === 'video') return;
            currentMode = 'video';
            modeVideo.classList.add('active');
            modePhoto.classList.remove('active');
            startCamera();
        });

        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        flashBtn.addEventListener('click', async () => {
            const track = currentStream?.getVideoTracks()[0];
            if (track) {
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    torchState = !torchState;
                    try {
                        await track.applyConstraints({ advanced: [{ torch: torchState }] });
                        flashBtn.classList.toggle('active-torch', torchState);
                    } catch (e) { console.error(e); }
                } else {
                    alert("Bu cihazda flaş desteklenmiyor.");
                }
            }
        });

        captureBtn.addEventListener('click', () => {
            if (currentMode === 'photo') {
                takePhoto();
            } else {
                toggleVideoRecording();
            }
        });

        function takePhoto() {
            flashEffect.style.opacity = '1';
            setTimeout(() => { flashEffect.style.opacity = '0'; }, 120);

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            
            if (currentFacingMode === 'user') {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                lastBlob = blob;
                lastFileName = `kamera_foto_${Date.now()}.jpg`;
                const url = URL.createObjectURL(blob);
                
                photoPreview.src = url;
                downloadBtn.href = url;
                downloadBtn.download = lastFileName;

                video.style.display = 'none';
                photoPreview.style.display = 'block';
                showPreviewControls();
            }, 'image/jpeg', 0.95);
        }

        function toggleVideoRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                recordedChunks = [];
                let mimeType = 'video/webm;codecs=vp9,opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

                try {
                    mediaRecorder = new MediaRecorder(currentStream, mimeType ? { mimeType } : {});
                } catch (e) {
                    mediaRecorder = new MediaRecorder(currentStream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    lastBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    lastFileName = `kamera_video_${Date.now()}.webm`;
                    const url = URL.createObjectURL(lastBlob);

                    videoPreview.src = url;
                    downloadBtn.href = url;
                    downloadBtn.download = lastFileName;

                    video.style.display = 'none';
                    videoPreview.style.display = 'block';
                    showPreviewControls();
                };

                mediaRecorder.start();
                captureBtn.classList.add('recording');
                modePhoto.style.pointerEvents = 'none';
                modeVideo.style.pointerEvents = 'none';
                
                secondsCount = 0;
                recTimer.style.display = 'block';
                recTimer.innerText = "🔴 00:00";
                recordingTimer = setInterval(() => {
                    secondsCount++;
                    let m = Math.floor(secondsCount / 60).toString().padStart(2, '0');
                    let s = (secondsCount % 60).toString().padStart(2, '0');
                    recTimer.innerText = `🔴 ${m}:${s}`;
                }, 1000);

            } else {
                mediaRecorder.stop();
                captureBtn.classList.remove('recording');
                clearInterval(recordingTimer);
                recTimer.style.display = 'none';
            }
        }

        function showPreviewControls() {
            captureBtn.style.display = 'none';
            switchCameraBtn.style.display = 'none';
            flashBtn.style.display = 'none';
            document.querySelector('.mode-selector').style.display = 'none';
            
            retakeBtn.style.display = 'block';
            downloadBtn.style.display = 'block';
            shareBtn.style.display = 'block';
        }

        retakeBtn.addEventListener('click', () => {
            photoPreview.style.display = 'none';
            videoPreview.style.display = 'none';
            videoPreview.src = '';
            video.style.display = 'block';
            
            retakeBtn.style.display = 'none';
            downloadBtn.style.display = 'none';
            shareBtn.style.display = 'none';
            
            captureBtn.style.display = 'block';
            switchCameraBtn.style.display = 'flex';
            flashBtn.style.display = 'flex';
            document.querySelector('.mode-selector').style.display = 'flex';
            modePhoto.style.pointerEvents = 'auto';
            modeVideo.style.pointerEvents = 'auto';
        });

        shareBtn.addEventListener('click', async () => {
            if (!lastBlob) return;
            const file = new File([lastBlob], lastFileName, { type: lastBlob.type });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Medya', text: 'Kamera uygulamam ile çekildi!' });
                } catch (err) {
                    if (err.name !== 'AbortError') alert("Paylaşım iptal/hata: " + err.message);
                }
            } else {
                alert("Cihazınız doğrudan dosya paylaşımını desteklemiyor.");
            }
        });

        startCamera();
    </script>
</body>
</html>
