<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Uygulaması</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 24px; }
        
        /* Gizli Dosya Girdisi */
        input[type="file"] {
            display: none;
        }

        /* Fotoğraf Çek Butonu */
        .btn-capture {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #007aff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kamera Uygulaması</h1>

        <!-- JS olmadan doğrudan cihaz kamerasını açan HTML elemanı -->
        <label for="camera-input" class="btn-capture">
            📷 Fotoğraf Çek
        </label>
        <input 
            type="file" 
            id="camera-input" 
            accept="image/*" 
            capture="environment"
        >
    </div>

</body>
</html>
